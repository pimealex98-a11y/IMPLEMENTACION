<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - Somos Networks</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      padding: 40px 30px;
      background: rgba(18, 26, 36, 0.85);
      border: 1px solid rgba(82, 194, 52, 0.4);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(82, 194, 52, 0.2);
    }
    h1 {
      font-size: 80px;
      font-weight: 900;
      color: #52c234;
      line-height: 1;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #fff;
    }
    p {
      color: #90a4ae;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(to right, #061700, #52c234);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(82, 194, 52, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(82, 194, 52, 0.6);
      background: linear-gradient(to right, #0a2500, #61dd3e);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>El enlace al que intentas acceder no existe o fue movido temporalmente.</p>
    <a href="index.html" class="btn">
      <i class="fa-solid fa-house"></i>
      Volver al Inicio
    </a>
  </div>
</body>
</html>
